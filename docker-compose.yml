services:
  api:
    command: >
      /bin/sh -c '
      dotnet restore &&
      exec dotnet run
      '
    container_name: api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    image: mcr.microsoft.com/dotnet/sdk:10.0
    ports:
      - 5246:5246
    volumes:
      - ./backend:/app
    working_dir: /app
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    container_name: frontend
    image: node:lts-alpine
    working_dir: /app
    ports:
      - 5173:5173
    environment:
      VITE_API_URL: ${VITE_API_URL:-api:5246/api}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./frontend:/app
      - npm-cache:/root/.npm
    command: >
      /bin/sh -c '
      npm i &&
      exec npm run dev
      '
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  npm-cache:
